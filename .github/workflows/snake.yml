# Redraws the contribution snake in the profile README once a day.
name: snake
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#127a6c&color_dots=#ebedf0,#a7e8de,#5ccfbd,#2bb5a0,#127a6c
            dist/snake-dark.svg?palette=github-dark&color_snake=#7ce7d6&color_dots=#161b22,#0e4e47,#127a6c,#1ea591,#7ce7d6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
