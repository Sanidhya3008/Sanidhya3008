# Redraws the contribution snake in the profile README once a day.
name: snake
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#127a6c&color_dots=#ebedf0,#a6f4e8,#3fd1bb,#159c89,#0b5c52
            dist/snake-dark.svg?palette=github-dark&color_snake=#7ce7d6&color_dots=#161b22,#0b5c52,#159c89,#3fd1bb,#a6f4e8
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
